services:
  - type: web
    name: crop-knowledge-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: CROP_DB_URL
        sync: false
      - key: CROP_DB_USER
        sync: false
      - key: CROP_DB_PASSWORD
        sync: false
      - key: CROP_UPLOAD_DIR
        value: /tmp/crop-uploads
      - key: CROP_FORCE_HTTPS
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
